name: Check servers and reports

# Every 15 minutes:
#  1. Pings every server and writes Online/Asleep/Offline + players to Firestore (meta/status).
#  2. Makes a Public server Private once it has 3 reports for the same reason, and emails the owner.
# See .github/report-checker/*.mjs for the secrets they need.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-reports
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: .github/report-checker
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Check server status
        run: node check-status.mjs

      - name: Check reports
        # Still runs if the status check failed.
        if: ${{ !cancelled() }}
        run: node check-reports.mjs
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          ADMIN_EMAIL: ${{ secrets.ADMIN_EMAIL }}

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Servers - PortL</title>
  <meta name="description" content="List your Minecraft Bedrock server so console players can join it with PortL.">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="site">
    <h1><a href="/">PortL</a></h1>
    <nav><a href="/discover/">Discover</a><a href="/my/" aria-current="page">My Servers</a></nav>
  </header>

  <main class="panel" id="loading"><p>Loading…</p></main>

  <main class="panel wide hidden" id="page">
    <div class="row" style="justify-content:space-between">
      <h2 style="margin:0">My Servers</h2>
      <button class="button small hidden" type="button" id="sign-out" style="flex:none">Sign out</button>
    </div>
    <p class="muted hidden" id="who"></p>

    <div class="tabs" role="tablist">
      <button type="button" role="tab" data-tab="mine" aria-selected="true">My servers</button>
      <button type="button" role="tab" data-tab="favourites" aria-selected="false">Favourites</button>
      <button type="button" role="tab" data-tab="recent" aria-selected="false">Recent</button>
    </div>

    <section class="hidden" id="signed-out">
      <p id="signed-out-text"></p>
      <button class="button green" type="button" id="sign-in">Sign in with Google</button>
      <p class="error hidden" id="sign-in-error"></p>
      <p class="muted">Players don't need an account to use PortL. Your name and email are never shown on server pages.</p>
    </section>

    <section class="hidden" id="tab-mine">
      <p class="notice hidden" id="flagged" role="alert"></p>
      <button class="button green" type="button" id="add">Add server</button>
      <p class="muted" id="list-status"></p>
      <div class="cards" id="cards"></div>
    </section>

    <section class="hidden" id="tab-favourites">
      <p class="muted" id="fav-status"></p>
      <div class="cards" id="fav-cards"></div>
    </section>

    <section class="hidden" id="tab-recent">
      <p class="muted" id="recent-status"></p>
      <div class="cards" id="recent-cards"></div>
      <button class="button small hidden" type="button" id="clear-recent" style="margin-top:14px">Clear recent</button>
    </section>
  </main>

  <dialog id="edit-dialog">
    <form id="edit-form" novalidate>
      <h2 id="edit-title">Add server</h2>
      <label for="f-name">Name</label>
      <input type="text" id="f-name" maxlength="48" autocomplete="off" required>
      <label for="f-host">Address (IP or domain)</label>
      <input type="text" id="f-host" maxlength="253" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="play.example.com" required>
      <label for="f-port">Port</label>
      <input type="number" id="f-port" min="1" max="65535" value="19132" required>
      <label for="f-desc">Description</label>
      <textarea id="f-desc" maxlength="300"></textarea>
      <div class="hint" id="desc-count"></div>
      <label>Tags (up to 5)</label>
      <div class="tags" id="f-tags"></div>
      <label>Visibility</label>
      <div class="choice" id="f-visibility">
        <button type="button" data-value="private" aria-pressed="true">Private</button>
        <button type="button" data-value="public" aria-pressed="false">Public</button>
      </div>
      <div class="hint" id="vis-hint"></div>
      <p class="error hidden" id="edit-error"></p>
      <div class="row">
        <button class="button" type="button" id="edit-cancel">Cancel</button>
        <button class="button green" type="submit" id="edit-save">Save</button>
      </div>
    </form>
  </dialog>

  <dialog id="delete-dialog">
    <h2>Delete server?</h2>
    <p>Are you sure you want to delete <b id="delete-name"></b>? Its page and QR code will stop working.</p>
    <p class="error hidden" id="delete-error"></p>
    <div class="row">
      <button class="button" type="button" id="delete-cancel">Cancel</button>
      <button class="button red" type="button" id="delete-confirm">Delete</button>
    </div>
  </dialog>

  <footer class="site"><p>Not affiliated with Mojang or Microsoft.</p></footer>

  <script type="module" src="/js/my.js"></script>
</body>
</html>
